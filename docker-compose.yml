version: '3.8'

services:
  paimana-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paimana-intelligence
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=paimana-production-secure-key-sih-2024-2026
      - DATABASE_URL=sqlite:///./paimana.db
      - CORS_ORIGINS=["http://localhost:8000","http://127.0.0.1:8000","http://localhost:5173"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
